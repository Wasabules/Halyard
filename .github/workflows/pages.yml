# Publishes the website in site/ to GitHub Pages.
#
# tools/build-site.py assembles it: the landing page from site/, the user guide
# rendered from docs/INSTALL.md and docs/guide/*.md, the logo and background
# from the app's own branding, the screenshots from docs/screenshots/ - so the
# repository holds one copy of each.
name: pages

# The site is linked as wasabules.github.io/Halyard - the path follows the
# repository's name, case included; GitHub redirects it to wherever the account
# serves its Pages. Keep the github.io address in the repository: the export's
# identity check refuses anything else.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "resources/img/background.jpg"
      - "clients/borealis/branding/png/**"
      - "docs/screenshots/**"
      - "docs/guide/**"
      - "docs/INSTALL.md"
      - "tools/build-site.py"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Pages belongs to the public repository; the private development one runs
    # the same workflows.
    if: github.repository == 'Wasabules/halyard'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: build the site and the guide
        run: |
          set -euo pipefail
          pip install --quiet "markdown==3.11"
          python3 tools/build-site.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
