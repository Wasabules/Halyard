# Not a theoretical guard.
#
# On 2026-09-12 a full census of the tracked files found the MASTER capture's
# chacha20 session key still in the clear in six tools, 391 B of a live ED25519
# SSH private key quoted inside an RE report, and a key fragment leaking from a
# .gitignore COMMENT -- three months after SEC2 had closed the same leak on the
# emission side. Masking a secret where it is printed does nothing for the one
# already written to a file.
name: secrets

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
