# Cheap checks that each guard a mistake this repo has actually made.
name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      # A half-migrated file is the worst state: English at the top, French in
      # the middle, and no word-list grep finds it because every block carries
      # enough English to pass. Two DISTINCT markers in one block is what finds
      # them -- eighteen survived three manual passes that way, and ten more
      # survived the migration being declared finished.
      - name: no half-migrated comment blocks
        run: python3 tools/check_french.py

      # `core/` is the library a second client (Qt, Tauri) is meant to reuse.
      # One `#include "../../clients/..."` would end that quietly - the build
      # would still pass, and the next client would find out. LIB1.
      - name: core/ depends on no client
        run: python3 tools/check-core-independence.py

      # A tool once shipped with its docstring closed one line early.
      # Nothing noticed until someone ran it.
      - name: python compiles
        run: |
          fail=0
          while read -r f; do
            python3 -m py_compile "$f" || { echo "::error file=$f::does not compile"; fail=1; }
          done < <(git ls-files '*.py' | grep -v '^07-averne-ffmpeg/')
          exit $fail

      - name: shell parses
        run: |
          fail=0
          while read -r f; do
            bash -n "$f" || { echo "::error file=$f::does not parse"; fail=1; }
          done < <(git ls-files '*.sh')
          exit $fail

      - name: javascript parses
        run: |
          fail=0
          while read -r f; do
            node --check "$f" || { echo "::error file=$f::does not parse"; fail=1; }
          done < <(git ls-files '*.js' | grep -v '^07-averne-ffmpeg/')
          exit $fail

      # The vendored libraries are gitignored, so nothing else notices when a
      # local fix goes missing. Two of Borealis' seven did, and stayed MISSING
      # for months (K20). This only checks what a runner can see without
      # cloning them, so it passes vacuously on a bare checkout -- the real
      # guard is `tools/bootstrap-libs.sh --check` on a working tree.
      - name: vendored fixes, if the libraries are present
        run: |
          if [ -d third_party/borealis ]; then
            bash tools/bootstrap-libs.sh --check
          else
            echo "libraries absent on the runner - nothing to check"
          fi

      # devlink.py drives the console's UI; its own offline autotest is what
      # catches a change to the rendered reasons it matches on.
      - name: devlink autotest
        run: python3 tools/client/devlink.py --autotest
