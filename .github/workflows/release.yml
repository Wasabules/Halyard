# Publishes a release on a `vX.Y.Z` tag: the Switch `.nro`, the PS Vita `.vpk`,
# and the source the GPL requires to go with them.
#
# IT REFUSES BEFORE IT BUILDS. Gates run first and every other job waits on
# them: nothing in the tree may be someone else's to redistribute
# (tools/check-redistributable.py), the tag must be a plain vX.Y.Z, and
# CHANGELOG.md must say what it contains. The moment this workflow uploads a
# package, whatever it contains is being distributed by us, automatically and
# at scale.
#
# === THE TAG IS THE VERSION (2026-09-26) ================================
#
# CMakeLists.txt reads the version from the vX.Y.Z tag, so tagging is the whole
# release gesture - there is no number to edit first. What can still go wrong is
# a build that did not SEE the tag (a shallow clone stamps "0.0.0-dev"), so
# before publishing, tools/check-release-version.py reads the version back out
# of the .nro's NACP and the .vpk's param.sfo and LiveArea, and refuses on any
# mismatch. Run by hand (workflow_dispatch, no tag), this workflow builds and
# checks but publishes nothing.
#
# === THE .vpk, AND WHY IT WAS MISSING UNTIL 2026-09-26 ==================
#
# The PS Vita package used to link the vitasdk's libcurl, built on OpenSSL
# 1.0.2, statically, next to GPL code (ours and wolfSSL's). The OpenSSL 1.x
# licence carries an advertising clause the GPL does not allow, so the package
# could not be redistributed and was built but not attached. libcurl is now
# rebuilt for the Vita on Mbed TLS (tools/build-libs.sh vita curl) and the ELF
# holds no OpenSSL code. The same day, the vitasdk's FFmpeg (with LAME and
# mpg123, all LGPL, at versions vdpm does not pin) was replaced by our own
# FLAC-only build of the tarball the Switch pins - so the source bundled below
# is exactly what the package contains. build-psvita.yml checks both on the ELF.
#
# The build jobs are CALLED, not copied. build-psvita.yml once carried its own
# copy of the wolfSSL recipe; the copy drifted, lost the seed macro, and would
# have shipped a package that cannot open a TLS socket while reporting success.
#
# The desktop builds are NOT attached. The Windows .exe links MSYS2's libraries
# statically, and a release would owe the Corresponding Source of every one of
# them - an audit not done yet. The Linux binary links the system's libraries
# and would not run on another distribution. Both stay CI artifacts.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Nothing builds until this passes.
  redistributable:
    # The private development repository carries the same workflows; a tag
    # there must not publish anything.
    if: github.repository == 'Wasabules/halyard'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: is everything here ours to ship?
        run: python3 tools/check-redistributable.py
      - name: the tag is a release version, and the changelog describes it
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          echo "tag ${GITHUB_REF_NAME}"
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::a release tag is vX.Y.Z"; exit 1; }
          grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no '## [${GITHUB_REF_NAME#v}]' section"; exit 1; }

  switch:
    needs: redistributable
    uses: ./.github/workflows/build-switch.yml

  psvita:
    needs: redistributable
    uses: ./.github/workflows/build-psvita.yml

  # GPL-3.0 section 6: the Corresponding Source of the object code is ALL the
  # source needed to build it - ours, every library at the exact commit it was
  # built from, and the scripts. The first version of this bundle held the
  # libraries and the scripts but not our own code, and not FFmpeg, which the
  # Switch build compiles outside third_party/.
  corresponding-source:
    needs: redistributable
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: fetch the libraries at their pinned commits
        run: bash tools/bootstrap-libs.sh
      # FFmpeg, for both consoles: the official release tarball, checked
      # against the pinned hash. The Switch's nvtegra patch and both build
      # recipes (build-ffmpeg-switch.sh, build-libs.sh vita ffmpeg) are in the
      # repository, so tarball + repo = the exact source of both packages.
      - name: fetch the FFmpeg source at its pinned hash
        run: |
          set -euo pipefail
          . tools/pins.env
          mkdir -p switch-portlibs
          curl -sSfL -o "switch-portlibs/ffmpeg-$FFMPEG_VERSION.tar.xz" \
               "https://ffmpeg.org/releases/ffmpeg-$FFMPEG_VERSION.tar.xz"
          echo "$FFMPEG_SHA256  switch-portlibs/ffmpeg-$FFMPEG_VERSION.tar.xz" | sha256sum -c -
      # A tarball has no git, so it cannot read its version from a tag:
      # CMakeLists.txt falls back to this file.
      - name: record the version for a build from this tarball
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "${GITHUB_REF_NAME#v}" > VERSION
      # Written OUTSIDE the tree it archives: tar exits 1 on "file changed as we
      # read it" when the archive grows inside the directory being read - the
      # first real release run (v0.1.0) failed exactly there.
      - name: bundle
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/corresponding-source.tar.gz"
          tar --exclude-vcs --exclude='build_*' -czf "$out" .
          ls -la "$out"
      - uses: actions/upload-artifact@v4
        with: { name: corresponding-source, path: "${{ runner.temp }}/corresponding-source.tar.gz" }

  publish:
    needs: [switch, psvita, corresponding-source]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: what came back
        run: find dist -type f -printf '%10s  %p\n'
      # Read back out of the packages, the way a console reads them. On a tag
      # the packages must say exactly the tag; a dry run only prints what they
      # say, since there is no release number to compare against.
      - name: every package announces the tag
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            python3 tools/check-release-version.py "${GITHUB_REF_NAME#v}" \
              --nro dist/halyard-switch/halyard.nro --vpk dist/halyard-psvita/halyard.vpk
          else
            python3 tools/check-release-version.py 0.0.0 \
              --nro dist/halyard-switch/halyard.nro --vpk dist/halyard-psvita/halyard.vpk || true
            echo "dry run: nothing is published"
          fi
      - name: release notes, from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" 'index($0, "## [" v "]") == 1 {on=1; next} on && /^## \[/ {exit} on' \
              CHANGELOG.md > notes.md
          test -s notes.md
          cat .github/release-footer.md >> notes.md
          cat notes.md
      - name: release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Halyard ${{ github.ref_name }}
          body_path: notes.md
          files: |
            dist/halyard-switch/halyard.nro
            dist/halyard-psvita/halyard.vpk
            dist/corresponding-source/corresponding-source.tar.gz
          fail_on_unmatched_files: true
